  <title>قال الإمام علي بن أبي طالب: الرزق نوعان: رزق يطلبك، ورزق تطلبه. فأما الذي يطلبك فسوف يأتيك ولو على ضعفك. وأما الذي تطلبه فلن يأتيك إلا بسعيك. وهو أيضا من رزقك. </title>
