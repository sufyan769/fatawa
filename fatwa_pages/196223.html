  <title>كنت أتكلم مع زوجي, فقلت له: (لو كان عندي فين أروح مش حكمل معاك), فقال لي: (يعني مش جالسة معي لأنك بتحبيني, جالسة فقط لأنه معندكيش مخرج), فقلت له: (صح), فقال لي:</title>
