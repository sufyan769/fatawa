  <title>سمعت بالخطأ زوجي يقول لي: أنت طالق. حيث إنه لم يقل ذلك، ولكن أنا سمعت خطأ، لكن الذي حدث أني قلت لزوجي لقد سمعتك قلت لي أنت طالق. فسألني زوجي أنا قلت ذلك؟ فأجبته</title>
