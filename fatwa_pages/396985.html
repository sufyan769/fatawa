  <title>قال لي زوجي: سوف أطلقك، وأعطيك حقوقك، فقلت له: لا أريد شيئًا (قاصدة بذلك حقوقي)، ثم أردت أن يطلقني، فقلت له: طلقني إن كنت تريد، ولا أذكر هل أعدت مرة أخرى أني لا</title>
