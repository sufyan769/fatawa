  <title>قال لي أحدهم: هناك سجدات واجبة في القرآن، يجب على الإنسان أن يسجدها في صلاة التراويح، أو التهجد. السؤال: هل هناك سجدات واجبة، وأخرى غير ذلك؟ أم كل السجدات سواء؟</title>
