  <title>قال تعالى: وَإنْ تَجْهَر بالْقَوْل فَإنَّهُ يَعْلَم السّرّ وَأَخْفَى.قرأت في كتب إعراب القرآن أن جملة: فَإنَّهُ يَعْلَم السّرّ وَأَخْفَى. جواب الشرط. إذن يصبح ا</title>
