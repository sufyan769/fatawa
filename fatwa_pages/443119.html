  <title>لديَّ سؤال، وهو: قول: (إن شاء الله) عند الدعاء. هل يختلف عن قول: (إن شئت)؟ وإن كان يقصد بقول: (إن شاء الله)، كقول: (يا رب استجب لي)، ولا يقصد فيها: إن شئت استجب</title>
