  <title>لقد طلقت زوجتي إثر خلاف حاد بقولي لهــا: (أنت طالق) وطلبت منهــا الذهاب لمنزل أهلهــا فوراً، فرفضت ذلك. فقلت لهــا: اذهبي، اخرجي من منزلي. أنــا (خلاص طلقتك). ع</title>
