  <title>ما حكم من ذهب إلى الحجـ وهو ما زال يقضي صلواته الفائتة؟ أي أنه كان يقضي قدر المستطاع، ومنَّ الله عليه بالحج، وبعد الحج استمر في قضاء ما تبقى، وهل يجوز قضاء صلاة</title>
