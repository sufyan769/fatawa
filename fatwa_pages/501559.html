  <title>طلقتُ زوجتي الطلقة الأولى، وقبل أن تنقضي العدة حصل بيني وبينها خلاف، فطلقتها الثانية والثالثة.علماً بأني لم أردَّها، وأنا مدرك للطلاق. فهل يقع الطلاق ثلاثاً؟</title>
