<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عرض الفتوى - موسوعة الفتاوى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Naskh Arabic', sans-serif;
      }
      .line-clamp-2 {
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
  }
}
</script>
</head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
import React, { useState, useEffect, useCallback } from 'react';
import ReactDOM from 'react-dom/client';

// --- Constants & Types ---
const API_BASE_URL = 'https://g85b062bd5c6cb1-fatwaproject.adb.me-dubai-1.oraclecloudapps.com/ords/SUFEAN/fatwas/search/';

// --- Components ---
const BookIcon = ({ className }) => (
    <svg 
        xmlns="http://www.w3.org/2000/svg" 
        className={className || "h-6 w-6"}
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor" 
        strokeWidth={2}
    >
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v11.494m0 0a7.5 7.5 0 007.5-7.5H4.5a7.5 7.5 0 007.5 7.5z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M14 12V4.5a2.25 2.25 0 00-2.25-2.25h-1.5A2.25 2.25 0 008 4.5v7.5m6 0v2.25a2.25 2.25 0 01-2.25-2.25h-1.5a2.25 2.25 0 01-2.25-2.25V12m6 0h-6" />
    </svg>
);

const LoadingSpinner = () => (
  <div className="flex justify-center items-center p-8">
    <div className="w-12 h-12 border-4 border-t-4 border-gray-200 border-t-emerald-600 rounded-full animate-spin"></div>
  </div>
);

const FatwaDetail = ({ fatwa, relatedFatwas }) => {
    
  const handleIdClick = (id) => {
    window.location.href = `fatwa_view.html?id=${id}`;
  };

  const parseAndLinkAnswer = (text) => {
    if (!text) return '';
    const regex = /(\[\d+\])/g;
    const parts = text.split(regex);

    return parts.map((part, index) => {
      if (regex.test(part)) {
        const numberString = part.replace(/\D/g, '');
        const fatwaId = parseInt(numberString, 10);
        if (!isNaN(fatwaId)) {
          return (
            <a
              key={index}
              href={`fatwa_view.html?id=${fatwaId}`}
              onClick={(e) => {
                e.preventDefault();
                handleIdClick(fatwaId);
              }}
              className="text-emerald-600 dark:text-emerald-400 font-bold hover:underline mx-1"
            >
              {part}
            </a>
          );
        }
      }
      return part.split('\n').map((line, i) => (
        <React.Fragment key={`${index}-${i}`}>
            {line}
            {i < part.split('\n').length - 1 && <br/>}
        </React.Fragment>
      ));
    });
  };

  return (
    <div className="w-full max-w-4xl mx-auto flex flex-col gap-8">
      <div className="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 animate-fade-in">
          <a href="index.html" className="mb-6 inline-block px-4 py-2 bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-200 rounded-md hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
              &rarr; العودة للبحث
          </a>
        <div className="border-b-2 border-emerald-500 pb-4 mb-4">
          <p className="text-md text-emerald-600 dark:text-emerald-400 font-bold">معرف الفتوى: {fatwa.id}</p>
          <h1 className="text-2xl font-bold text-gray-900 dark:text-gray-100 mt-2">{fatwa.question}</h1>
        </div>
        <div className="max-w-none text-gray-700 dark:text-gray-300 leading-loose">
          <h2 className="text-xl font-bold text-gray-800 dark:text-gray-200 mb-2">الجواب:</h2>
          <p className="text-2xl whitespace-pre-wrap">{parseAndLinkAnswer(fatwa.answer)}</p>
        </div>
        <div className="mt-8 pt-4 border-t border-gray-200 dark:border-gray-700">
          <p className="text-sm text-gray-500 dark:text-gray-400">
            <span className="font-semibold">المصدر:</span> {fatwa.source}
          </p>
        </div>
      </div>
      
      {relatedFatwas.length > 0 && (
        <div className="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8 animate-fade-in">
          <h3 className="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-4">فتاوى ذات صلة</h3>
          <ul className="flex flex-col divide-y divide-gray-200 dark:divide-gray-700">
            {relatedFatwas.map(relatedFatwa => (
              <li 
                key={relatedFatwa.id}
                onClick={() => handleIdClick(relatedFatwa.id)}
                className="py-3 cursor-pointer group"
              >
                <a href={`fatwa_view.html?id=${relatedFatwa.id}`} className="text-lg text-gray-700 dark:text-gray-300 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors duration-200 line-clamp-2">
                  {relatedFatwa.question}
                </a>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
};

// --- Main App Logic ---

const App = () => {
  const [fatwa, setFatwa] = useState(null);
  const [relatedFatwas, setRelatedFatwas] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [error, setError] = useState(null);

  const fetchRelatedFatwas = useCallback(async (currentFatwa) => {
    if (!currentFatwa.question || currentFatwa.question.trim().length === 0) {
        setRelatedFatwas([]);
        return;
    }
    const keywords = currentFatwa.question.split(' ').filter(word => word.length > 3);
    const query = keywords.length > 0 ? keywords[0] : currentFatwa.question.split(' ')[0];

    if (!query) {
        setRelatedFatwas([]);
        return;
    }
    
    try {
        const response = await fetch(`${API_BASE_URL}${encodeURIComponent(query)}`);
        const data = await response.json();
        const items = data.items || [];
        const filteredItems = items.filter(item => item.id !== currentFatwa.id).slice(0, 5);
        setRelatedFatwas(filteredItems);
    } catch (err) {
        console.error("Failed to fetch related fatwas:", err);
        setRelatedFatwas([]);
    }
  }, []);

  const fetchFatwa = useCallback(async (id) => {
    setIsLoading(true);
    setError(null);
    setRelatedFatwas([]);
    try {
      const response = await fetch(`${API_BASE_URL}${encodeURIComponent(id)}`);
      if (!response.ok) {
        throw new Error(`خطأ في الشبكة: ${response.statusText}`);
      }
      const data = await response.json();
      const items = data.items || [];
      
      if(items.length > 0) {
        const foundFatwa = items[0];
        setFatwa(foundFatwa);
        document.title = `${foundFatwa.question.substring(0, 50)}... - موسوعة الفتاوى`;
        fetchRelatedFatwas(foundFatwa);
      } else {
        throw new Error(`لم يتم العثور على فتوى بالمعرف: ${id}`);
      }
    } catch (err) {
        if (err instanceof Error) {
            setError(err.message);
        } else {
            setError('حدث خطأ غير متوقع');
        }
        setFatwa(null);
    } finally {
      setIsLoading(false);
    }
  }, [fetchRelatedFatwas]);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const fatwaId = params.get('id');
    if (fatwaId) {
        fetchFatwa(fatwaId);
    } else {
        setError('لم يتم تحديد معرف للفتوى.');
        setIsLoading(false);
    }
  }, [fetchFatwa]);

  return (
    <div className="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">
      <main className="container mx-auto px-4 py-8">
        <header className="text-center mb-8">
            <a href="index.html" className="flex justify-center items-center gap-4 text-emerald-600 dark:text-emerald-400 no-underline">
                <BookIcon className="w-12 h-12"/>
                <h1 className="text-5xl font-bold">موسوعة الفتاوى</h1>
            </a>
        </header>
        
        {error && <p className="text-center text-red-500 bg-red-100 dark:bg-red-900 dark:text-red-300 p-4 rounded-md my-4">{error}</p>}
        
        <div className="mt-10">
            {isLoading ? (
                <LoadingSpinner />
            ) : fatwa ? (
                <FatwaDetail 
                  fatwa={fatwa}
                  relatedFatwas={relatedFatwas}
                />
            ) : null}
        </div>
      </main>
    </div>
  );
};

// --- App Mount ---

const rootElement = document.getElementById('root');
if (!rootElement) {
  throw new Error("Could not find root element to mount to");
}

const root = ReactDOM.createRoot(rootElement);
root.render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);

    </script>
  </body>
</html>
