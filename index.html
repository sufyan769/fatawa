<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موسوعة الفتاوى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <style>
      body { font-family: 'Noto Naskh Arabic', sans-serif; }
      .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
      .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
  }
}
</script>
</head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
import React, { useState, useEffect, useCallback } from 'react';
import ReactDOM from 'react-dom/client';

const API_BASE_URL = 'https://g85b062bd5c6cb1-fatwaproject.adb.me-dubai-1.oraclecloudapps.com/ords/SUFEAN/fatwas/search/';
const API_ID_LOOKUP_BASE_URL = 'https://g85b062bd5c6cb1-fatwaproject.adb.me-dubai-1.oraclecloudapps.com/ords/SUFEAN/fatwas/search_source/';
const RANDOM_SEARCH_TERMS = ['الصلاة', 'الزكاة', 'الحج', 'الصوم', 'الطلاق', 'الزواج'];

const App = () => {
  const [fatwas, setFatwas] = useState([]);
  const [selectedFatwa, setSelectedFatwa] = useState(null);
  const [relatedFatwas, setRelatedFatwas] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [error, setError] = useState(null);
  const [listTitle, setListTitle] = useState('فتاوى مختارة');
  const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');

  const fetchRelatedFatwas = useCallback(async (fatwa) => {
    if (!fatwa?.question) return;
    try {
      const q = fatwa.question.split(' ').find(w => w.length > 3) || fatwa.question;
      const res = await fetch(`${API_BASE_URL}${encodeURIComponent(q)}`);
      const data = await res.json();
      setRelatedFatwas((data.items || []).filter(i => i.id !== fatwa.id).slice(0, 5));
    } catch { setRelatedFatwas([]); }
  }, []);

  const fetchFatwas = useCallback(async (query, isIdSearch = false) => {
    setIsLoading(true);
    setError(null);
    try {
      if (isIdSearch) {
        const id = parseInt(query.replace(/\D/g, ''));
        const res = await fetch(`${API_ID_LOOKUP_BASE_URL}${id}`);
        const data = await res.json();
        const item = data.items?.[0];
        if (item) {
          const fatwa = { id: item.id, question: item.question, answer: item.text, source: item.source };
          setSelectedFatwa(fatwa);
          await fetchRelatedFatwas(fatwa);
        } else setError('لم يتم العثور على فتوى بالمعرف المحدد');
      } else {
        const res = await fetch(`${API_BASE_URL}${encodeURIComponent(query)}`);
        const data = await res.json();
        setFatwas(data.items || []);
      }
    } catch (err) { setError(err.message); }
    finally { setIsLoading(false); }
  }, [fetchRelatedFatwas]);

  // ✅ افتح الفتوى مباشرة من الرابط
  useEffect(() => {
    const parts = window.location.pathname.split('/');
    const idx = parts.indexOf('fatwa');
    if (idx !== -1 && parts[idx + 1]) {
      const id = parts[idx + 1].replace(/\D/g, '');
      if (id) fetchFatwas(id, true);
    }
  }, [fetchFatwas]);

  useEffect(() => {
    theme === 'dark' ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
    localStorage.setItem('theme', theme);
  }, [theme]);

  useEffect(() => {
    const term = RANDOM_SEARCH_TERMS[Math.floor(Math.random() * RANDOM_SEARCH_TERMS.length)];
    fetchFatwas(term);
  }, [fetchFatwas]);

  return (
    <div className="text-center text-gray-700 dark:text-gray-100 p-10">
      <h1 className="text-4xl mb-4">موسوعة الفتاوى</h1>
      {isLoading ? <p>⏳ جاري التحميل...</p> :
        error ? <p className="text-red-500">{error}</p> :
        selectedFatwa ? (
          <div>
            <h2 className="text-2xl font-bold">{selectedFatwa.question}</h2>
            <p className="mt-4 whitespace-pre-wrap">{selectedFatwa.answer}</p>
            <p className="mt-4 text-sm text-gray-500">المصدر: {selectedFatwa.source}</p>
          </div>
        ) : (
          <ul className="max-w-2xl mx-auto">
            {fatwas.map(f => (
              <li key={f.id} className="p-4 border-b cursor-pointer hover:text-emerald-600"
                  onClick={() => { setSelectedFatwa(f); fetchRelatedFatwas(f); window.history.pushState({}, '', `/fatawa/fatwa/${f.id}/`); }}>
                {f.question}
              </li>
            ))}
          </ul>
        )}
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
  </body>
</html>
