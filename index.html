<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحة هل يجوز - فتاوى شرعية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }
      /* Custom scrollbar for better aesthetics in results */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9; /* blue-50 */
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #60a5fa; /* blue-400 */
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3b82f6; /* blue-500 */
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
<body class="bg-blue-50">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useCallback, forwardRef } = React;

        // --- Icon Components ---
        const BookOpen = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
        );
        const Search = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        );
        const Hash = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <line x1="4" y1="9" x2="20" y2="9" />
            <line x1="4" y1="15" x2="20" y2="15" />
            <line x1="10" y1="3" x2="8" y2="21" />
            <line x1="16" y1="3" x2="14" y2="21" />
          </svg>
        );
        const Loader2 = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
        );
        const ZoomIn = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
            <line x1="11" y1="8" x2="11" y2="14" />
            <line x1="8" y1="11" x2="14" y2="11" />
          </svg>
        );
        const ZoomOut = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
            <line x1="8" y1="11" x2="14" y2="11" />
          </svg>
        );
        const ArrowLeft = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
        );

        // --- UI Components ---
        const Card = ({ className, children, ...props }) => (
          <div className={`bg-white rounded-xl border border-gray-200 ${className}`} {...props}>{children}</div>
        );
        const CardHeader = ({ className, children, ...props }) => (
          <div className={`p-6 ${className}`} {...props}>{children}</div>
        );
        const CardTitle = ({ className, children, ...props }) => (
          <h3 className={`text-lg font-semibold leading-none tracking-tight ${className}`} {...props}>{children}</h3>
        );
        const CardContent = ({ className, children, ...props }) => (
          <div className={`p-6 pt-0 ${className}`} {...props}>{children}</div>
        );

        const Input = forwardRef(
          ({ className, type, ...props }, ref) => (
            <input
              type={type}
              className={`flex h-10 w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 ${className}`}
              ref={ref}
              {...props}
            />
          )
        );
        
        const Button = forwardRef(
          ({ className, variant = 'default', size = 'default', ...props }, ref) => {
            const baseClasses = "inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none";
            const variantClasses = {
              default: "bg-blue-600 text-white hover:bg-blue-700",
              outline: "border border-gray-300 bg-transparent hover:bg-gray-100",
            };
            const sizeClasses = {
              default: "h-10 py-2 px-4",
              sm: "h-9 px-3 rounded-md",
            };
            return <button className={`${baseClasses} ${variantClasses[variant]} ${sizeClasses[size]} ${className}`} ref={ref} {...props} />;
          }
        );

        // --- Main App Component ---
        function App() {
          const [currentFatwa, setCurrentFatwa] = useState(null);
          const [searchQuery, setSearchQuery] = useState("");
          const [searchResults, setSearchResults] = useState([]);
          const [isLoading, setIsLoading] = useState(false);
          const [error, setError] = useState(null);
          const [randomQuestions, setRandomQuestions] = useState([]);
          const [visibleQuestion, setVisibleQuestion] = useState(null);
          const [isFading, setIsFading] = useState(false);
          const [fontSize, setFontSize] = useState(16);
          const [view, setView] = useState("home");

          const fetchFatwaById = useCallback(async (id) => {
            setIsLoading(true);
            setError(null);
            try {
              const response = await fetch(`https://g85b062bd5c6cb1-fatwaproject.adb.me-dubai-1.oraclecloudapps.com/ords/SUFEAN/fatwas/search/${id}`);
              if (!response.ok) throw new Error("الفتوى غير موجودة");
              const data = await response.json();
              if (data.items && data.items.length > 0) {
                setCurrentFatwa(data.items[0]);
                setView("fatwa");
                window.scrollTo({ top: 0, behavior: 'smooth' });
              } else {
                throw new Error("الفتوى غير موجودة");
              }
            } catch (err) {
              setError(err instanceof Error ? err.message : "حدث خطأ غير معروف");
            } finally {
              setIsLoading(false);
            }
          }, []);

          const searchFatwas = useCallback(async (query) => {
            if (!query.trim()) return;
            setIsLoading(true);
            setError(null);
            setSearchResults([]);
            try {
              const response = await fetch(`https://g85b062bd5c6cb1-fatwaproject.adb.me-dubai-1.oraclecloudapps.com/ords/SUFEAN/fatwas/search/${query}`);
              if (!response.ok) throw new Error("فشل في البحث");
              const data = await response.json();
              setSearchResults(data.items || []);
            } catch (err) {
              setError(err instanceof Error ? err.message : "حدث خطأ أثناء البحث");
            } finally {
              setIsLoading(false);
            }
          }, []);

          const handleSearch = () => searchFatwas(searchQuery);
          const handleKeyDown = (e) => e.key === 'Enter' && handleSearch();

          const navigateToFatwa = (id) => {
            const existingFatwa = [...randomQuestions, ...searchResults].find(f => f.id === id);
            if (existingFatwa) {
              setCurrentFatwa(existingFatwa);
              setView("fatwa");
              window.scrollTo({ top: 0, behavior: 'smooth' });
              return;
            }
            fetchFatwaById(id);
          };

          const fetchRandomQuestions = useCallback(async () => {
            try {
              const queries = ["الصلاة", "الصيام", "الزكاة", "الحج", "الطهارة", "النكاح", "الطلاق", "الجنابة", "الغسل", "الوضوء", "القبلة", "المسجد", "الصدقة", "القرآن", "الذكر", "الدعاء"];
              const promises = queries.map(query => fetch(`https://g85b062bd5c6cb1-fatwaproject.adb.me-dubai-1.oraclecloudapps.com/ords/SUFEAN/fatwas/search/${query}`));
              const responses = await Promise.all(promises);
              const jsonData = await Promise.all(responses.map(res => res.ok ? res.json() : { items: [] }));
              const allQuestions = jsonData.flatMap(data => data.items || []);
              const uniqueQuestions = Array.from(new Map(allQuestions.map(item => [item.id, item])).values());
              const shuffled = [...uniqueQuestions].sort(() => 0.5 - Math.random()).slice(0, 30);
              setRandomQuestions(shuffled);
            } catch (err) {
              console.error("Error fetching random questions:", err);
            }
          }, []);

          useEffect(() => {
            fetchRandomQuestions();
          }, []);

          useEffect(() => {
            if (randomQuestions.length > 0) {
              let currentIndex = 0;
              setVisibleQuestion(randomQuestions[currentIndex]);
              const interval = setInterval(() => {
                setIsFading(true);
                setTimeout(() => {
                  currentIndex = (currentIndex + 1) % randomQuestions.length;
                  setVisibleQuestion(randomQuestions[currentIndex]);
                  setIsFading(false);
                }, 500);
              }, 3500);
              return () => clearInterval(interval);
            }
          }, [randomQuestions]);

          const increaseFontSize = () => setFontSize(prev => Math.min(prev + 2, 24));
          const decreaseFontSize = () => setFontSize(prev => Math.max(prev - 2, 12));
          
          const goHome = () => {
            setView('home');
            setError(null);
            setCurrentFatwa(null);
            setSearchQuery("");
            setSearchResults([]);
          };

          const renderAnswerWithLinks = (text) => {
              if (!text) return text;

              const regex = /(?:الفتوى رقم|ورقم|رقم|برقم)\s*[:\s]*(\d+)/g;
              const parts = [];
              let lastIndex = 0;
              let match;

              while ((match = regex.exec(text)) !== null) {
                  if (match.index > lastIndex) {
                      parts.push(text.substring(lastIndex, match.index));
                  }
                  
                  const fatwaId = parseInt(match[1], 10);
                  parts.push(
                      <a
                          key={`fatwa-link-${fatwaId}-${match.index}`}
                          href="#"
                          className="text-blue-600 font-bold hover:underline"
                          onClick={(e) => {
                              e.preventDefault();
                              navigateToFatwa(fatwaId);
                          }}
                      >
                          {match[0]}
                      </a>
                  );
                  
                  lastIndex = regex.lastIndex;
              }

              if (lastIndex < text.length) {
                  parts.push(text.substring(lastIndex));
              }

              return parts.length > 0 ? <>{parts}</> : text;
          };

          return (
            <div className="min-h-screen bg-gradient-to-b from-blue-50 to-white py-8 px-4 font-[sans-serif]">
              <div className="max-w-6xl mx-auto">
                <header className="text-center mb-8">
                  <h1 className="text-3xl md:text-4xl font-bold text-blue-900 mb-2 flex items-center justify-center gap-2">
                    <BookOpen className="text-blue-600" />
                    صفحة هل يجوز
                  </h1>
                  <p className="text-gray-600">أسئلة فقهية وإجابات شرعية</p>
                </header>

                {view === "home" ? (
                  <>
                    <Card className="mb-8 shadow-lg bg-blue-50 border-blue-200">
                      <CardHeader><CardTitle className="text-center text-blue-800">أسئلة فقهية شائعة</CardTitle></CardHeader>
                      <CardContent className="min-h-[100px] flex items-center justify-center">
                        <div className={`transition-opacity duration-500 ${isFading ? 'opacity-0' : 'opacity-100'}`}>
                          {visibleQuestion && (
                            <div className="text-center w-full">
                              <div className="text-lg md:text-xl font-medium text-gray-800 cursor-pointer hover:text-blue-700 transition-colors px-4" onClick={() => navigateToFatwa(visibleQuestion.id)}>
                                {visibleQuestion.question.length > 120 ? `${visibleQuestion.question.substring(0, 120)}...` : visibleQuestion.question}
                              </div>
                              <div className="mt-2 text-sm text-blue-600 flex items-center justify-center gap-1">
                                <Hash size={14} /><span>رقم الفتوى: {visibleQuestion.id}</span>
                              </div>
                            </div>
                          )}
                        </div>
                      </CardContent>
                    </Card>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-10">
                      {randomQuestions.slice(0, 18).map((fatwa) => (
                        <Card key={fatwa.id} className="hover:shadow-md transition-shadow cursor-pointer border border-blue-100" onClick={() => navigateToFatwa(fatwa.id)}>
                          <CardContent className="p-4 pt-4">
                            <div className="flex items-start gap-3">
                              <Hash className="text-blue-500 mt-1 flex-shrink-0" size={16} />
                              <div>
                                <div className="text-sm text-blue-600 font-medium mb-1">رقم: {fatwa.id}</div>
                                <p className="text-gray-800 text-sm leading-relaxed">{fatwa.question.length > 90 ? `${fatwa.question.substring(0, 90)}...` : fatwa.question}</p>
                              </div>
                            </div>
                          </CardContent>
                        </Card>
                      ))}
                    </div>
                    
                    <Card className="mb-8 shadow-lg sticky top-4 z-10 bg-white/80 backdrop-blur-sm">
                      <CardHeader>
                        <CardTitle className="flex items-center gap-2 text-blue-800"><Search className="text-blue-600" />البحث في الأسئلة الفقهية</CardTitle>
                      </CardHeader>
                      <CardContent>
                        <div className="flex gap-2">
                          <Input type="text" placeholder="ابحث برقم الفتوى أو كلمة مفتاحية..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyDown={handleKeyDown} className="flex-grow"/>
                          <Button onClick={handleSearch} disabled={isLoading}>{isLoading ? <Loader2 className="h-4 w-4 animate-spin" /> : "بحث"}</Button>
                        </div>
                        <p className="text-sm text-gray-500 mt-2">أدخل رقم الفتوى للبحث المباشر أو كلمة مفتاحية للبحث العام</p>
                      </CardContent>
                    </Card>

                    {searchResults.length > 0 && (
                      <Card className="mb-8 shadow-lg">
                        <CardHeader><CardTitle>نتائج البحث</CardTitle></CardHeader>
                        <CardContent>
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[40rem] overflow-y-auto p-1 custom-scrollbar">
                            {searchResults.map((fatwa) => (
                              <div key={fatwa.id} className="p-4 border border-gray-200 rounded-lg hover:bg-blue-50 transition cursor-pointer" onClick={() => navigateToFatwa(fatwa.id)}>
                                <div className="flex items-center gap-2 mb-2">
                                  <Hash className="text-blue-600" size={16} /><span className="font-semibold text-blue-700">السؤال رقم: {fatwa.id}</span>
                                </div>
                                <p className="text-gray-800">{fatwa.question}</p>
                              </div>
                            ))}
                          </div>
                        </CardContent>
                      </Card>
                    )}
                  </>
                ) : (
                  <Card className="shadow-lg">
                    <CardHeader className="border-b">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <Button onClick={goHome}><ArrowLeft className="ml-2 h-4 w-4" />العودة للصفحة الرئيسية</Button>
                        <div className="flex items-center gap-2">
                          <span className="text-sm text-gray-600">حجم النص:</span>
                          <Button variant="outline" size="sm" onClick={decreaseFontSize} disabled={fontSize <= 12}><ZoomOut className="h-4 w-4" /></Button>
                          <span className="text-sm w-8 text-center tabular-nums">{fontSize}px</span>
                          <Button variant="outline" size="sm" onClick={increaseFontSize} disabled={fontSize >= 24}><ZoomIn className="h-4 w-4" /></Button>
                        </div>
                      </div>
                    </CardHeader>
                    <CardContent className="pt-6">
                      {error ? (
                        <div className="text-center py-10 text-red-500">
                          <p>{error}</p>
                          <Button onClick={goHome} className="mt-4">العودة للصفحة الرئيسية</Button>
                        </div>
                      ) : isLoading ? (
                        <div className="flex justify-center items-center h-64"><Loader2 className="h-12 w-12 animate-spin text-blue-600" /></div>
                      ) : currentFatwa ? (
                        <div className="space-y-6">
                          <div className="flex items-center gap-2 p-3 bg-blue-50 rounded-lg border border-blue-200">
                            <Hash className="text-blue-600" /><span className="font-semibold text-blue-700">السؤال رقم: {currentFatwa.id}</span>
                          </div>
                          <div>
                            <h3 className="font-bold text-gray-800 mb-2" style={{ fontSize: `${fontSize + 2}px` }}>السؤال:</h3>
                            <p className="text-gray-700 leading-relaxed" style={{ fontSize: `${fontSize}px` }}>{currentFatwa.question}</p>
                          </div>
                          <div className="border-t pt-6">
                            <h3 className="font-bold text-gray-800 mb-2" style={{ fontSize: `${fontSize + 2}px` }}>الإجابة:</h3>
                            <div className="text-gray-700 leading-relaxed whitespace-pre-line" style={{ fontSize: `${fontSize}px` }}>{renderAnswerWithLinks(currentFatwa.answer)}</div>
                          </div>
                        </div>
                      ) : (
                        <div className="text-center py-10 text-gray-500">
                          <p>الفتوى غير متوفرة</p>
                          <Button onClick={goHome} className="mt-4">العودة للصفحة الرئيسية</Button>
                        </div>
                      )}
                    </CardContent>
                  </Card>
                )}

                <footer className="mt-12 text-center text-gray-600 text-sm">
                  <p>جميع الحقوق محفوظة © صفحة هل يجوز - {new Date().getFullYear()}</p>
                </footer>
              </div>
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
