<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موسوعة الفتاوى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Naskh Arabic', sans-serif;
      }
      .line-clamp-2 {
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
import React, { useState, useEffect, useCallback } from 'react';
import ReactDOM from 'react-dom/client';

// --- Constants & Types ---
const API_BASE_URL = 'https://g85b062bd5c6cb1-fatwaproject.adb.me-dubai-1.oraclecloudapps.com/ords/SUFEAN/fatwas/search/';
const RANDOM_SEARCH_TERMS = ['الصلاة', 'الزكاة', 'الحج', 'الصوم', 'الطلاق', 'الزواج'];

// --- Components ---

const SearchIcon = ({ className }) => (
  <svg
    xmlns="http://www.w3.org/2000/svg"
    className={className || "h-6 w-6"}
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    strokeWidth={2}
  >
    <path
      strokeLinecap="round"
      strokeLinejoin="round"
      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
    />
  </svg>
);

const BookIcon = ({ className }) => (
    <svg 
        xmlns="http://www.w3.org/2000/svg" 
        className={className || "h-6 w-6"}
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor" 
        strokeWidth={2}
    >
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.253v11.494m0 0a7.5 7.5 0 007.5-7.5H4.5a7.5 7.5 0 007.5 7.5z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M14 12V4.5a2.25 2.25 0 00-2.25-2.25h-1.5A2.25 2.25 0 008 4.5v7.5m6 0v2.25a2.25 2.25 0 01-2.25-2.25h-1.5a2.25 2.25 0 01-2.25-2.25V12m6 0h-6" />
    </svg>
);

const LoadingSpinner = () => (
  <div className="flex justify-center items-center p-8">
    <div className="w-12 h-12 border-4 border-t-4 border-gray-200 border-t-emerald-600 rounded-full animate-spin"></div>
  </div>
);

const SearchInput = ({ onSearch, isLoading }) => {
  const [query, setQuery] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    if (query.trim()) {
      onSearch(query.trim());
    }
  };

  return (
    <form onSubmit={handleSubmit} className="w-full max-w-2xl mx-auto my-8">
      <div className="relative">
        <input
          type="text"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          placeholder="ابحث عن فتوى..."
          className="w-full px-5 py-3 pr-12 text-lg text-gray-700 bg-white border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-emerald-500 dark:bg-gray-800 dark:text-gray-200 dark:border-gray-600"
          disabled={isLoading}
        />
        <button
          type="submit"
          className="absolute inset-y-0 right-0 flex items-center justify-center w-14 h-full text-white bg-emerald-600 rounded-l-none rounded-r-full hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 disabled:bg-emerald-400"
          disabled={isLoading}
        >
          <SearchIcon className="w-6 h-6" />
        </button>
      </div>
    </form>
  );
};

const FatwaListItem = ({ fatwa }) => {
  const handleSelect = () => {
      window.location.href = `fatwa_view.html?id=${fatwa.id}`;
  };

  return (
    <div
      onClick={handleSelect}
      className="py-5 cursor-pointer group"
    >
      <h3 className="text-xl font-semibold text-gray-800 dark:text-gray-100 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors duration-200 line-clamp-2">
        {fatwa.question}
      </h3>
      <a href={`fatwa_view.html?id=${fatwa.id}`} className="text-md text-emerald-600 dark:text-emerald-400 mt-1 inline-block">
        ... أكمل القراءة
      </a>
    </div>
  );
};

const FatwaList = ({ fatwas, title }) => {
  if (fatwas.length === 0) {
    return (
        <div className="text-center p-8">
            <p className="text-gray-600 dark:text-gray-400">لم يتم العثور على نتائج.</p>
        </div>
    );
  }

  return (
    <div className="w-full max-w-4xl mx-auto">
      <h2 className="text-3xl font-bold text-center mb-6 text-gray-800 dark:text-gray-200">{title}</h2>
      <div className="bg-white dark:bg-gray-800 rounded-lg shadow-md">
        <div className="flex flex-col divide-y divide-gray-200 dark:divide-gray-700 px-6">
            {fatwas.map((fatwa) => (
              <FatwaListItem key={fatwa.id} fatwa={fatwa} />
            ))}
        </div>
      </div>
    </div>
  );
};

const FeaturedQuestions = ({ fatwas }) => {
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isFading, setIsFading] = useState(false);

  useEffect(() => {
    if (fatwas.length < 2) return;

    const interval = setInterval(() => {
      setIsFading(true);
      setTimeout(() => {
        setCurrentIndex((prevIndex) => (prevIndex + 1) % fatwas.length);
        setIsFading(false);
      }, 500); 
    }, 5000); 

    return () => clearInterval(interval);
  }, [fatwas]);
  
  const handleQuestionClick = (fatwa) => {
    if(fatwa) {
        window.location.href = `fatwa_view.html?id=${fatwa.id}`;
    }
  };

  if (fatwas.length === 0) {
    return null;
  }
  
  const currentFatwa = fatwas[currentIndex];

  return (
    <div className="w-full max-w-4xl mx-auto my-6 p-6 bg-emerald-50 dark:bg-gray-800 rounded-lg shadow-sm text-center cursor-pointer hover:bg-emerald-100 dark:hover:bg-gray-700 transition-colors" onClick={() => handleQuestionClick(currentFatwa)}>
      <p className="text-gray-600 dark:text-gray-400 mb-2 font-semibold">سؤال مميز</p>
      <h3 
        className={`text-xl font-bold text-emerald-800 dark:text-emerald-300 transition-opacity duration-500 h-14 line-clamp-2 ${isFading ? 'opacity-0' : 'opacity-100'}`}
      >
        {currentFatwa?.question}
      </h3>
    </div>
  );
};

// --- Main App Logic ---

const App = () => {
  const [fatwas, setFatwas] = useState([]);
  const [isLoading, setIsLoading] = useState(true);
  const [error, setError] = useState(null);
  const [listTitle, setListTitle] = useState('فتاوى مختارة');

  const fetchFatwas = useCallback(async (query) => {
    setIsLoading(true);
    setError(null);
    try {
      const response = await fetch(`${API_BASE_URL}${encodeURIComponent(query)}`);
      if (!response.ok) {
        throw new Error(`خطأ في الشبكة: ${response.statusText}`);
      }
      const data = await response.json();
      const items = data.items || [];
      setFatwas(items);
    } catch (err) {
        if (err instanceof Error) {
            setError(err.message);
        } else {
            setError('حدث خطأ غير متوقع');
        }
        setFatwas([]);
    } finally {
      setIsLoading(false);
    }
  }, []);

  useEffect(() => {
    const randomTerm = RANDOM_SEARCH_TERMS[Math.floor(Math.random() * RANDOM_SEARCH_TERMS.length)];
    setListTitle('فتاوى مختارة');
    fetchFatwas(randomTerm);
  }, [fetchFatwas]);

  const handleSearch = (query) => {
    setListTitle(`نتائج البحث عن: "${query}"`);
    fetchFatwas(query);
  };

  return (
    <div className="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">
      <main className="container mx-auto px-4 py-8">
        <header className="text-center mb-8">
            <div className="flex justify-center items-center gap-4 text-emerald-600 dark:text-emerald-400">
                <BookIcon className="w-12 h-12"/>
                <h1 className="text-5xl font-bold">موسوعة الفتاوى</h1>
            </div>
            <p className="mt-4 text-lg text-gray-600 dark:text-gray-400">
                محرك بحث متخصص في الفتاوى الشرعية مع إمكانية التنقل بين الفتاوى المترابطة
            </p>
        </header>

        <FeaturedQuestions fatwas={fatwas} />
        
        <SearchInput onSearch={handleSearch} isLoading={isLoading} />
        
        {error && <p className="text-center text-red-500 bg-red-100 dark:bg-red-900 dark:text-red-300 p-4 rounded-md my-4">{error}</p>}
        
        <div className="mt-10">
            {isLoading ? (
                <LoadingSpinner />
            ) : (
                <FatwaList fatwas={fatwas} title={listTitle} />
            )}
        </div>
      </main>
    </div>
  );
};

// --- App Mount ---

const rootElement = document.getElementById('root');
if (!rootElement) {
  throw new Error("Could not find root element to mount to");
}

const root = ReactDOM.createRoot(rootElement);
root.render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);

    </script>
  </body>
</html>
